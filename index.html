<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio PDF viewer">
  <title>Portfolio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111318; color: #f7f7f8; }
    header { height: 64px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #2b2f38; background: rgba(17,19,24,.94); }
    h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
    nav { display: flex; gap: 10px; }
    a { color: inherit; text-decoration: none; }
    .button { padding: 9px 14px; border: 1px solid #3b414d; border-radius: 9px; font-size: 14px; transition: .2s ease; }
    .button:hover { border-color: #8b94a5; background: #252a33; }
    .primary { background: #f4f4f5; color: #111318; border-color: #f4f4f5; }
    .primary:hover { background: #d9d9dc; border-color: #d9d9dc; }
    main { height: calc(100vh - 64px); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #252830; }
    .fallback { display: none; padding: 48px 24px; text-align: center; }
    @media (max-width: 540px) {
      header { height: auto; min-height: 64px; padding: 12px 14px; }
      h1 { font-size: 15px; }
      .button { padding: 8px 10px; font-size: 13px; }
      main { height: calc(100vh - 64px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Portfolio</h1>
    <nav aria-label="문서 메뉴">
      <a class="button" href="portfolio-1440.pdf" target="_blank" rel="noopener">새 창에서 보기</a>
      <a class="button primary" href="portfolio-1440.pdf" download>PDF 다운로드</a>
    </nav>
  </header>
  <main>
    <iframe src="portfolio-1440.pdf#view=FitH" title="포트폴리오 PDF">
      <p class="fallback">PDF를 표시할 수 없습니다. <a href="portfolio-1440.pdf">여기에서 열어주세요.</a></p>
    </iframe>
  </main>
</body>
</html>
